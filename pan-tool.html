<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAN Card Photo Resizer - FormTools Pro</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#222}
  .top{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}
  .logo{font-size:22px;font-weight:800;color:#0d4fc4;text-decoration:none}
  .logo span{color:#4f6df5}
  .back{text-decoration:none;color:#fff;background:#0d6efd;padding:9px 16px;border-radius:8px;font-weight:600}
  .wrap{max-width:640px;margin:30px auto;padding:0 16px}
  .box{background:#fff;border-radius:16px;padding:26px;box-shadow:0 6px 20px rgba(0,0,0,.07)}
  h1{margin:0 0 6px;text-align:center;color:#0d4fc4;font-size:28px}
  .sub{text-align:center;margin:0 0 10px;color:#555}
  .row{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px}
  .opt{position:relative;background:#f8f9fa;border:2px solid #dee2e6;border-radius:12px;
    padding:34px 14px 14px;text-align:center;cursor:pointer;min-width:130px;flex:1}
  .opt input{display:none}
  .tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#0d6efd;color:#fff;
    padding:4px 14px;border-radius:6px;font-size:17px;white-space:nowrap}
  .icon{font-size:44px;height:70px;display:flex;align-items:center;justify-content:center}
  .icon img{max-width:100%;max-height:70px}
  .dot{width:32px;height:32px;border:2px solid #555;border-radius:50%;margin:10px auto 0}
  .opt:has(input:checked){border-color:#0d6efd;background:#eef4ff}
  .opt:has(input:checked) .dot{background:#0d6efd;box-shadow:inset 0 0 0 6px #eef4ff}
  .divider{display:flex;align-items:center;gap:10px;margin:30px 0 4px;color:#555;font-size:19px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#bbb}
  .spec{margin:22px 0 14px;background:#f8f9fa;border:1px solid #dee2e6;border-radius:8px;padding:12px;text-align:center}
  input[type=file]{width:100%;padding:12px;border:2px dashed #9bb8f0;border-radius:10px;background:#f7faff}
  button{width:100%;margin-top:16px;background:#0d6efd;color:#fff;border:0;border-radius:10px;
    padding:14px;font-size:18px;cursor:pointer}
  #msg{margin-top:14px;text-align:center;font-weight:600}
  #preview{text-align:center}
  #preview img{max-width:100%;border:1px solid #ccc;margin-top:14px;background:#fff}
  #dl{display:none;margin-top:14px;text-align:center;background:#198754;color:#fff;padding:13px;
    border-radius:10px;text-decoration:none;font-weight:700}
</style>
</head>
<body>

<div class="top">
  <a class="logo" href="INDEX.HTML">FORMTOOLS <span>PRO</span></a>
  <a class="back" href="INDEX.HTML">← Home</a>
</div>

<div class="wrap">
  <div class="box">
    <h1>PAN Card Photo Resizer</h1>
    <p class="sub">UTI / NSDL ke hisab se photo aur signature resize karein.</p>

    <div class="row">
      <label class="opt"><span class="tag">UTI</span>
        <div class="icon"><b style="color:#2b2a85">UTIITSL</b></div>
        <input type="radio" name="prov" value="UTI"><div class="dot"></div></label>
      <label class="opt"><span class="tag">NSDL</span>
        <div class="icon"><b style="color:#8b1a1a;font-size:34px">NSDL</b></div>
        <input type="radio" name="prov" value="NSDL"><div class="dot"></div></label>
    </div>

    <div class="divider">Type</div>

    <div class="row">
      <label class="opt"><span class="tag">Photograph</span><div class="icon">👤</div>
        <input type="radio" name="type" value="photo"><div class="dot"></div></label>
      <label class="opt"><span class="tag">Signature</span><div class="icon">✍️</div>
        <input type="radio" name="type" value="sign"><div class="dot"></div></label>
      <label class="opt"><span class="tag">Document</span><div class="icon">📄</div>
        <input type="radio" name="type" value="doc"><div class="dot"></div></label>
    </div>

    <div class="spec" id="spec">Pehle UTI/NSDL aur Type select karein.</div>

    <input type="file" id="file" accept="image/*">
    <button id="go" type="button">Resize PAN Photo</button>

    <div id="msg"></div>
    <div id="preview"></div>
    <a id="dl">Download Photo</a>
  </div>
</div>

<script>
(function () {
  // Size/KB yahan edit karein — official site se verify zaroor karein.
  const SPECS = {
    UTI:  { photo:{w:213,h:213,kb:30}, sign:{w:400,h:200,kb:30}, doc:{w:null,h:null,kb:200} },
    NSDL: { photo:{w:213,h:213,kb:50}, sign:{w:354,h:157,kb:50}, doc:{w:null,h:null,kb:300} }
  };
  const $ = id => document.getElementById(id);
  const val = n => (document.querySelector('input[name=' + n + ']:checked') || {}).value;
  const msg = $('msg');
  const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));

  function getSpec() { const p = val('prov'), t = val('type'); return p && t ? SPECS[p][t] : null; }
  function showSpec() {
    const s = getSpec();
    $('spec').textContent = s
      ? 'Size: ' + (s.w ? s.w + '×' + s.h + ' px' : 'original') + ' • Max ' + s.kb + ' KB • JPG'
      : 'Pehle UTI/NSDL aur Type select karein.';
  }
  document.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', showSpec));

  $('file').addEventListener('change', function () {
    const f = this.files[0];
    msg.textContent = f ? 'Photo mil gayi: ' + f.name + '. Ab "Resize PAN Photo" dabayein.' : '';
  });

  function loadImage(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Ye image khul nahi rahi. JPG ya PNG try karein.'));
      img.src = URL.createObjectURL(file);
    });
  }

  $('go').addEventListener('click', async function () {
    try {
      const s = getSpec(), f = $('file').files[0];
      if (!s) { msg.textContent = 'Pehle UTI/NSDL aur Type select karein.'; return; }
      if (!f) { msg.textContent = 'Pehle photo choose karein.'; return; }
      msg.textContent = 'Resize ho raha hai...';
      const img = await loadImage(f);

      let w = s.w || img.naturalWidth, h = s.h || img.naturalHeight;
      if (!s.w) { const m = Math.max(w, h); if (m > 1600) { w = Math.round(w*1600/m); h = Math.round(h*1600/m); } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);

      let q = 0.95, blob = await toBlob(c, q);
      while (blob && blob.size > s.kb * 1024 && q > 0.1) { q -= 0.05; blob = await toBlob(c, q); }
      if (!blob) throw new Error('Image ban nahi paayi.');

      const url = URL.createObjectURL(blob);
      msg.textContent = blob.size <= s.kb * 1024
        ? 'Ho gaya: ' + w + '×' + h + ' px, ' + (blob.size/1024).toFixed(1) + ' KB'
        : 'Size ' + (blob.size/1024).toFixed(1) + ' KB hai, limit se zyada — chhoti image try karein.';
      $('preview').innerHTML = '<img src="' + url + '">';
      const a = $('dl'); a.href = url; a.download = val('prov') + '_' + val('type') + '.jpg'; a.style.display = 'block';
    } catch (e) { msg.textContent = 'Error: ' + e.message; }
  });
})();
</script>
</body>
</html>
